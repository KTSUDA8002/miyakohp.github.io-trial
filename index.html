<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勉強会・講演会情報</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: none;
            margin: 0;
            background-color: white;
            padding: 20px;
            border-radius: 0;
            box-shadow: none;
        }
        h1 {
            color: #333;
            text-align: left;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .month-section {
            margin: 30px 0;
            border-left: 4px solid #007bff;
            padding-left: 20px;
        }
        .month-title {
            font-size: 1.5em;
            color: #007bff;
            margin-bottom: 20px;
        }
        .event {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .pdf-icon {
            display: inline-block;
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .pdf-icon:hover {
            background-color: #c82333;
        }
        .event-info {
            margin: 5px 0;
        }
        .event-info strong {
            color: #333;
        }
        .download-link {
            color: #007bff;
            text-decoration: none;
        }
        .download-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <h1>勉強会・講演会情報</h1>
        <div id="events-container" class="loading">
            イベント情報を読み込み中...
        </div>
    </div>
    
    <script>
        // パスワード設定
        const correctPassword = "miyako69229090";

        // 認証関数
        function authenticate() {
            let password = prompt("このページにアクセスするにはパスワードが必要です。");
            if (password === correctPassword) {
                document.getElementById("content").style.display = "block";
                loadEvents();
            } else {
                alert("パスワードが間違っています。\n再度お試しください。");
                authenticate();
            }
        }

        // イベントデータを読み込んで表示
        async function loadEvents() {
            try {
                const response = await fetch('events.json');
                const data = await response.json();
                displayEvents(data.events);
            } catch (error) {
                document.getElementById('events-container').innerHTML = 
                    '<p style="color: red;">イベント情報の読み込みに失敗しました。</p>';
                console.error('Error loading events:', error);
            }
        }

        // イベントを月ごとにグループ化
        function groupEventsByMonth(events) {
            const grouped = {};
            events.forEach(event => {
                const date = new Date(event.date);
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                // ソート用のキー（YYYY-MM形式）と表示用のキーを両方保存
                const sortKey = `${year}-${month.toString().padStart(2, '0')}`;
                const displayKey = `${year}年${month}月`;
                if (!grouped[sortKey]) {
                    grouped[sortKey] = {
                        displayKey: displayKey,
                        events: []
                    };
                }
                grouped[sortKey].events.push(event);
            });
            return grouped;
        }

        // イベントを表示
        function displayEvents(events) {
            const container = document.getElementById('events-container');
            container.innerHTML = '';

            // 月ごとにグループ化
            const groupedEvents = groupEventsByMonth(events);

            // 月ごとに表示（ソートキーで日付順にソート）
            Object.keys(groupedEvents).sort().forEach(sortKey => {
                const monthData = groupedEvents[sortKey];
                const monthSection = document.createElement('div');
                monthSection.className = 'month-section';

                const monthTitle = document.createElement('div');
                monthTitle.className = 'month-title';
                monthTitle.textContent = `＜ ${monthData.displayKey} ＞`;
                monthSection.appendChild(monthTitle);

                // その月のイベントを日付順にソート
                monthData.events.sort((a, b) => new Date(a.date) - new Date(b.date));

                // 各イベントを表示
                monthData.events.forEach(event => {
                    const eventDiv = createEventElement(event);
                    monthSection.appendChild(eventDiv);
                });

                container.appendChild(monthSection);
            });
        }

        // 個別のイベント要素を作成
        function createEventElement(event) {
            const eventDiv = document.createElement('div');
            eventDiv.className = 'event';

            // PDFリンク（存在する場合）
            if (event.pdf) {
                const pdfLink = document.createElement('a');
                pdfLink.href = event.pdf;
                pdfLink.className = 'pdf-icon';
                pdfLink.target = '_blank';
                pdfLink.textContent = 'PDF チラシ';
                eventDiv.appendChild(pdfLink);
            }

            // イベント情報
            const infoItems = [
                { label: '名称', value: event.title },
                { label: '主催者', value: event.organizer },
                { label: '日時', value: formatDateTime(event.date, event.time) },
                { label: '開催形式', value: event.format }
            ];

            // 場所（存在する場合）
            if (event.location) {
                // URLの場合はリンクとして表示
                if (event.location.startsWith('http')) {
                    const locationInfo = document.createElement('div');
                    locationInfo.className = 'event-info';
                    locationInfo.innerHTML = `<strong>場所</strong>：<a href="${event.location}" class="download-link" target="_blank">${event.location}</a>`;
                    eventDiv.appendChild(locationInfo);
                } else {
                    infoItems.push({ label: '場所', value: event.location });
                }
            }

            // 通常の情報項目を追加
            infoItems.forEach(item => {
                if (item.value) {
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'event-info';
                    infoDiv.innerHTML = `<strong>${item.label}</strong>：${item.value}`;
                    eventDiv.appendChild(infoDiv);
                }
            });

            // 追加メモ（存在する場合）
            if (event.note) {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'event-info';
                noteDiv.textContent = `　　　　${event.note}`;
                eventDiv.appendChild(noteDiv);
            }

            // iCalリンク
            if (event.ical) {
                const icalInfo = document.createElement('div');
                icalInfo.className = 'event-info';
                icalInfo.innerHTML = `<strong>iCal形式</strong>：<a href="${event.ical}" class="download-link">データをダウンロード</a>`;
                eventDiv.appendChild(icalInfo);
            }

            return eventDiv;
        }

        // 日時のフォーマット
        function formatDateTime(dateStr, timeStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const weekday = weekdays[date.getDay()];

            return `${year}年${month}月${day}日（${weekday}） ${timeStr}`;
        }

        // ページ読み込み時にコンテンツを非表示にし、認証を開始
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("content").style.display = "none";
            authenticate();
        });
    </script>
</body>
</html>
